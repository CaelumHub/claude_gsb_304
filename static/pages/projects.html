<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目管理 - 自动化测试与持续集成平台</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="site-sidebar"></aside>

  <main class="main">
    <h1 class="page-title">项目管理</h1>
    <p class="page-desc">创建与管理测试项目，每个项目下维护用例、套件、环境、构建与缺陷。</p>

    <section class="card">
      <div class="row spread">
        <h2 style="margin:0">项目列表</h2>
        <div class="row">
          <button class="btn secondary" id="btn-seed">生成演示项目</button>
          <button class="btn" id="btn-new-toggle">新建项目</button>
        </div>
      </div>
      <div class="mt" id="project-list"><div class="empty">加载中…</div></div>
    </section>

    <section class="card" id="new-card" style="display:none">
      <h2>新建项目</h2>
      <div class="grid cols-2">
        <div>
          <label>项目名称 *</label>
          <input type="text" id="np-name" placeholder="例如：电商平台">
        </div>
        <div>
          <label>仓库地址</label>
          <input type="text" id="np-repo" placeholder="https://github.com/org/repo">
        </div>
      </div>
      <div class="mt">
        <label>描述</label>
        <textarea id="np-desc" placeholder="项目简介"></textarea>
      </div>
      <div class="mt">
        <label style="display:inline-flex;align-items:center;gap:6px;font-weight:400;color:var(--text)">
          <input type="checkbox" id="np-auto" style="width:auto"> 构建失败时自动把失败用例转为缺陷
        </label>
      </div>
      <div class="row mt">
        <button class="btn" id="btn-create">创建</button>
        <button class="btn secondary" id="btn-cancel">取消</button>
      </div>
    </section>
  </main>
</div>

<script src="/static/js/common.js"></script>
<script>
renderNav("projects");

let projects = [];

async function load() {
  const data = await api("/api/projects");
  projects = data.projects || [];
  const host = $("#project-list");
  if (!projects.length) {
    host.innerHTML = '<div class="empty">还没有项目，点击「生成演示项目」快速体验，或「新建项目」创建。</div>';
    return;
  }
  host.innerHTML = `
    <table>
      <thead><tr><th>名称</th><th>描述</th><th>用例</th><th>套件</th><th>构建</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody>
        ${projects.map(p => `
          <tr>
            <td><strong>${esc(p.name)}</strong></td>
            <td class="muted">${esc(p.description || "—")}</td>
            <td>${p.case_count}</td>
            <td>${p.suite_count}</td>
            <td>${p.build_count}</td>
            <td class="mono" style="font-size:12px">${fmtTime(p.created_at)}</td>
            <td>
              <div class="row" style="gap:6px">
                <a class="btn small secondary" href="/page/cases.html?project_id=${p.id}">用例</a>
                <a class="btn small secondary" href="/page/suites.html?project_id=${p.id}">套件</a>
                <a class="btn small secondary" href="/page/reports.html?project_id=${p.id}">报告</a>
                <button class="btn small danger" onclick="removeProject('${p.id}')">删除</button>
              </div>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

async function removeProject(id) {
  if (!confirm("确认删除该项目？相关用例、套件、构建将一并移除。")) return;
  await api(`/api/projects/${id}`, { method: "DELETE" });
  toast("项目已删除");
  load();
}

$("#btn-new-toggle").onclick = () => { $("#new-card").style.display = "block"; };
$("#btn-cancel").onclick = () => { $("#new-card").style.display = "none"; };

$("#btn-create").onclick = async () => {
  const name = $("#np-name").value.trim();
  if (!name) return toast("请输入项目名称", "error");
  await api("/api/projects", { method: "POST", body: {
    name, description: $("#np-desc").value, repo_url: $("#np-repo").value,
    auto_create_defects: $("#np-auto").checked,
  }});
  toast("项目已创建");
  $("#np-name").value = ""; $("#np-desc").value = ""; $("#np-repo").value = "";
  $("#new-card").style.display = "none";
  load();
};

$("#btn-seed").onclick = async () => {
  setLoading($("#btn-seed"), true, "生成中…");
  try {
    const r = await api("/api/seed/demo", { method: "POST" });
    toast(`已生成演示项目（${r.project.name}）`);
    load();
  } catch (e) { toast(e.message, "error"); }
  setLoading($("#btn-seed"), false);
};

load();
</script>
</body>
</html>
